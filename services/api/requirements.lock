# Complete Python 3.11 resolution for the API runtime, tests, and quality tools.
#
# Platform: resolved for CPython 3.11 on macOS/Linux (what setup and CI use).
# Pins are exact and carry no environment markers, so Windows is unsupported
# here (e.g. uvloop ships no Windows wheels). If Windows support is ever needed,
# regenerate with a marker-preserving tool (pip-tools' pip-compile) rather than
# pip freeze.
#
# This sample streams image-text datasets to B2 with img2dataset (CPU + network
# only; no torch — webdataset is pinned torch-optional). Keep requirements.txt as
# the human-edited input; refresh this file only from a clean Python 3.11 virtual
# environment as documented in docs/dev-workflows.md, then review the lock and
# OpenAPI contract together.
